; ESP32 firmware — v2 core (UPGRADE_PLAN Phase 1).
; deploy/ota-esp32.sh builds an env-injected copy inside /dev/shm only;
; cred-embedded firmware.bin is never persisted on this machine.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    marian-craciunescu/ESP32Ping@^1.7
build_flags =
    -DARDUINO_ESP32_DEV
    -DCORE_DEBUG_LEVEL=1
